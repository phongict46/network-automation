---
name: Backup Router Ansible

'on':
  schedule:
    - cron: '13 0 25 * *'
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select the device or group to configure'
        required: true
        default: 'routers'
        type: choice
        options:
          - routers
          - R1
          - R2
          - R3

permissions:
  contents: write

jobs:
  bakup:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Ubuntu Server
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          ansible-galaxy collection install -r requirements.yml
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
          chmod 600 .vault_pass
          trap 'rm -f .vault_pass' EXIT
          test -f group_vars/routers/vault.yml || {
            echo "Missing encrypted group_vars/routers/vault.yml"
            echo "Create it with ansible-vault and commit the encrypted file."
            exit 1
          }
          ansible-vault view group_vars/routers/vault.yml >/dev/null

          if [ "${{ github.event.inputs.target_device }}" = "routers" ]; then
            ansible-playbook playbooks/show_running_config.yml
          else
          ansible-playbook \
            playbooks/show_running_config.yml \
            --limit "${{ github.event.inputs.target_device }}"
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Commit router backups
        run: |
          git add configs/

          if git diff --cached --quiet; then
            echo "No configuration changes."
          else
            git commit -m "Router backup $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: Email router backups
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          TARGET_DEVICE: ${{ github.event.inputs.target_device || 'routers' }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          required = (
              "SMTP_SERVER",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "EMAIL_FROM",
              "EMAIL_TO",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              missing_secrets = ", ".join(missing)
              raise SystemExit(
                  f"Missing required GitHub Actions secrets: {missing_secrets}"
              )

          target_device = os.environ["TARGET_DEVICE"]
          if target_device == "routers":
              backup_files = sorted(
                  Path("configs").glob("*_running_config.txt")
              )
          else:
              backup_file = (
                  Path("configs") / f"{target_device}_running_config.txt"
              )
              backup_files = [backup_file] if backup_file.is_file() else []
          if not backup_files:
              raise SystemExit(
                  f"No backup file found for target {target_device!r}."
              )

          message = EmailMessage()
          message["Subject"] = (
              f"Router backup for {target_device} completed "
              f"(run {os.environ['GITHUB_RUN_NUMBER']})"
          )
          message["From"] = os.environ["EMAIL_FROM"]
          message["To"] = os.environ["EMAIL_TO"]
          message.set_content(
              "The router backup workflow completed successfully. "
              "The saved router configuration backup files are attached."
          )

          for backup_file in backup_files:
              message.add_attachment(
                  backup_file.read_bytes(),
                  maintype="text",
                  subtype="plain",
                  filename=backup_file.name,
              )

          server = os.environ["SMTP_SERVER"]
          port = int(os.environ["SMTP_PORT"])
          context = ssl.create_default_context()

          if port == 465:
              with smtplib.SMTP_SSL(
                  server, port, context=context, timeout=30
              ) as smtp:
                  smtp.login(
                      os.environ["SMTP_USERNAME"],
                      os.environ["SMTP_PASSWORD"],
                  )
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(server, port, timeout=30) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=context)
                  smtp.ehlo()
                  smtp.login(
                      os.environ["SMTP_USERNAME"],
                      os.environ["SMTP_PASSWORD"],
                  )
                  smtp.send_message(message)

          print(f"Email sent with {len(backup_files)} router backup file(s).")
          PY
