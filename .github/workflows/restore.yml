---
name: Restore Network Configuration

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select the device or group to restore'
        required: true
        default: 'routers'
        type: choice
        options:
          - routers
          - R1
          - R2
          - R3

jobs:
  restore:
    runs-on: self-hosted

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Router Backup Artifacts
        uses: actions/download-artifact@v4
        with:
          name: router-backups
          path: ./

      - name: Verify downloaded configurations
        run: ls -la *.txt

      - name: Deploy Restore Configuration via Ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventories/lab/hosts \
            playbooks/restore_config.yml \
            --extra-vars \
            "target_host=${{ github.event.inputs.target_device }}"
