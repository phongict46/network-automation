---
name: Deploy Network Configuration

'on':
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select the device or group to configure'
        required: true
        default: 'routers'
        type: choice
        options:
          - routers
          - R1
          - R2
          - R3

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Configuration via Ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          ansible-galaxy collection install -r requirements.yml
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
          chmod 600 .vault_pass
          trap 'rm -f .vault_pass' EXIT
          ansible-playbook -i inventories/lab/hosts \
            playbooks/deploy_config.yml \
            --extra-vars "target_host=${{ github.event.inputs.target_device }}"
          ansible-playbook -i inventories/lab/hosts \
            playbooks/configure_static_routes.yml \
            --extra-vars "target_host=${{ github.event.inputs.target_device }}"
