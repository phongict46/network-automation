---
- name: Gather and Separate Router Configurations
  hosts: routers
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/routers/vault.yml"

  tasks:
    - name: Run show running-config
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: config_output

    - name: Save individual configuration files locally
      ansible.builtin.copy:
        dest: >-
          {{ playbook_dir }}/../configs/
          {{ inventory_hostname }}_running_config.txt
        content: "{{ config_output.stdout | join('\n') }}"
        mode: '0644'  # 💡 Add this line to explicitly set file permissions
      delegate_to: localhost
